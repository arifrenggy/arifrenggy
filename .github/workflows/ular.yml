name: Ular kontribusi

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - name: Buat animasi ular dari grafik kontribusi
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/ular-terang.svg?palette=github-light&color_snake=#1f6f43
            dist/ular-gelap.svg?palette=github-dark&color_snake=#3fb950
      - name: Terbitkan ke cabang output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
