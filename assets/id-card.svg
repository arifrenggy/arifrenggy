<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Kartu identitas Kurniawan Arif Renggi">
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1b14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="garis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="45%" stop-color="#3fb950" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kilau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="potongAvatar">
      <circle cx="112" cy="150" r="52"/>
    </clipPath>
    <style>
      .nama { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #e6edf3; }
      .label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; letter-spacing: 2.4px; fill: #7d8590; }
      .nilai { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13.5px; fill: #c9d1d9; }
      .kunci { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; fill: #3fb950; }
      .denyut { animation: denyut 2.6s ease-in-out infinite; }
      .sapu { animation: sapu 4.6s linear infinite; }
      @keyframes denyut { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes sapu { 0% { transform: translateX(-260px); } 100% { transform: translateX(860px); } }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="300" rx="18" fill="url(#latar)"/>
  <rect x="0.75" y="0.75" width="818.5" height="298.5" rx="18" fill="none" stroke="#21262d" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="818.5" height="298.5" rx="18" fill="none" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="56 600">
    <animate attributeName="stroke-dashoffset" values="0;-656" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g class="sapu" opacity="0.28">
    <rect x="0" y="0" width="130" height="300" fill="url(#kilau)"/>
  </g>

  <text x="34" y="40" class="label">KARTU IDENTITAS PENGEMBANG</text>
  <circle cx="726" cy="36" r="5" fill="#3fb950" class="denyut"/>
  <text x="740" y="40" class="label" style="letter-spacing:1.6px">AKTIF</text>

  <line x1="34" y1="58" x2="786" y2="58" stroke="url(#garis)" stroke-width="1.2"/>

  <g>
    <circle cx="112" cy="150" r="58" fill="none" stroke="#3fb950" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="112" cy="150" r="60.5" fill="none" stroke="#3fb950" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="18 12">
      <animateTransform attributeName="transform" type="rotate" from="0 112 150" to="360 112 150" dur="18s" repeatCount="indefinite"/>
    </circle>
    <image x="60" y="98" width="104" height="104" clip-path="url(#potongAvatar)" xlink:href="data:image/jpeg;base64,"/>
  </g>

  <text x="196" y="106" class="nama" font-size="25">Kurniawan Arif Renggi</text>
  <text x="196" y="130" class="nilai" style="fill:#8b949e;font-size:12.5px">Full Stack Developer &#183; Teknik Informatika</text>

  <g>
    <text x="196" y="163" class="kunci">npm run</text>
    <text x="272" y="163" class="nilai">kenali &amp; bangun</text>
  </g>

  <line x1="196" y1="182" x2="786" y2="182" stroke="#21262d" stroke-width="1"/>

  <text x="196" y="205" class="label">DOMISILI</text>
  <text x="196" y="225" class="nilai">Waingapu, Sumba Timur</text>

  <text x="430" y="205" class="label">FOKUS</text>
  <text x="430" y="225" class="nilai">Web &#183; Android &#183; Machine Learning</text>

  <text x="196" y="255" class="label">TUMPUKAN UTAMA</text>
  <text x="196" y="275" class="nilai">Laravel &#183; React &#183; Flutter &#183; TensorFlow Lite</text>

  <g>
    <rect x="628" y="243" width="158" height="32" rx="8" fill="#0f1b14" stroke="#238636"/>
    <text x="643" y="263" class="kunci" style="font-size:11.5px">github.com/arifrenggy</text>
  </g>
</svg>
